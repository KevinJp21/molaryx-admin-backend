name: Pipeline

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/molaryx-api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "ERROR: This tag does not point to a commit in main."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest

    environment: production

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: molaryx-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -e

          REMOTE_SCRIPT=$(cat <<REMOTE_SCRIPT
          set -e

          cd /opt/molaryx

          echo "========================================"
          echo "Deploying Molaryx ${IMAGE_TAG}"
          echo "========================================"

          CURRENT_TAG=\$(grep '^IMAGE_TAG=' .env | cut -d '=' -f2-)
          PREVIOUS_TAG="\${CURRENT_TAG}"

          echo "Current version: \${CURRENT_TAG}"
          echo "New version:     ${IMAGE_TAG}"

          if [ "\${CURRENT_TAG}" = "${IMAGE_TAG}" ]; then
            echo "Already running ${IMAGE_TAG}."
            exit 0
          fi

          BACKUP_DIR="/opt/molaryx/backups"
          BACKUP_FILE="\${BACKUP_DIR}/pre-${IMAGE_TAG}-\$(date +%Y%m%d%H%M%S).sql"

          POSTGRES_USER=\$(grep '^POSTGRES_USER=' .env | cut -d '=' -f2-)
          POSTGRES_DB=\$(grep '^POSTGRES_DB=' .env | cut -d '=' -f2-)

          mkdir -p "\${BACKUP_DIR}"

          echo "========================================"
          echo "Creating database backup..."
          echo "========================================"

          docker compose exec -T postgres \
            pg_dump \
            -U "\${POSTGRES_USER}" \
            --clean \
            --if-exists \
            "\${POSTGRES_DB}" \
            > "\${BACKUP_FILE}"

          echo "\${PREVIOUS_TAG}" > "\${BACKUP_FILE}.tag"

          echo "Backup saved: \${BACKUP_FILE}"

          echo "========================================"
          echo "Authenticating with GHCR..."
          echo "========================================"

          GHCR_TOKEN=\$(aws secretsmanager get-secret-value \
            --secret-id "molaryx/ghcr-read-token" \
            --query "SecretString" \
            --output text)

          printf "%s" "\${GHCR_TOKEN}" | \
            docker login ghcr.io \
            --username "KevinJp21" \
            --password-stdin

          unset GHCR_TOKEN

          echo "GHCR authentication successful."

          echo "========================================"
          echo "Pulling ${IMAGE_TAG}..."
          echo "========================================"

          IMAGE_TAG=${IMAGE_TAG} docker compose pull api

          echo "========================================"
          echo "Updating IMAGE_TAG..."
          echo "========================================"

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

          grep '^IMAGE_TAG=' .env

          echo "========================================"
          echo "Stopping API before migration..."
          echo "========================================"

          docker compose stop api

          echo "========================================"
          echo "Applying EF Core migrations..."
          echo "========================================"

          if ! docker compose run --rm --no-deps api \
            dotnet molaryx-admin.dll --migrate; then

            echo "ERROR: Migration failed."

            echo "Restoring database..."

            docker compose exec -T postgres \
              psql \
              -U "\${POSTGRES_USER}" \
              -d "\${POSTGRES_DB}" \
              -v ON_ERROR_STOP=1 \
              < "\${BACKUP_FILE}"

            echo "Database restored."

            if [ -n "\${PREVIOUS_TAG}" ]; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=\${PREVIOUS_TAG}/" .env

              echo "Restoring API version: \${PREVIOUS_TAG}"

              IMAGE_TAG="\${PREVIOUS_TAG}" docker compose pull api
              docker compose up -d api
            fi

            echo "Waiting for rollback health..."

            for i in \$(seq 1 12); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo "Rollback successful."

                docker compose ps
                exit 1
              fi

              echo "Rollback health check attempt \${i}/12 failed."

              if [ "\${i}" -lt 12 ]; then
                sleep 5
              fi
            done

            echo "========================================"
            echo "CRITICAL: Migration failed and rollback health check also failed."
            echo "Backup: \${BACKUP_FILE}"
            echo "Previous version: \${PREVIOUS_TAG}"
            echo "========================================"

            docker compose ps
            docker logs molaryx-api --tail 100

            exit 1
          fi

          echo "========================================"
          echo "Starting API..."
          echo "========================================"

          docker compose up -d api

          echo "========================================"
          echo "Waiting for API health..."
          echo "========================================"

          API_HEALTHY=false

          for i in \$(seq 1 12); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "API is healthy."
              API_HEALTHY=true
              break
            fi

            echo "Health check attempt \${i}/12 failed."

            if [ "\${i}" -lt 12 ]; then
              sleep 5
            fi
          done

          if [ "\${API_HEALTHY}" = "true" ]; then
            echo "========================================"
            echo "Deployment successful: ${IMAGE_TAG}"
            echo "========================================"

            docker compose ps
            exit 0
          fi

          echo "========================================"
          echo "ERROR: API health check failed."
          echo "========================================"

          docker logs molaryx-api --tail 100

          echo "========================================"
          echo "Starting rollback..."
          echo "========================================"

          echo "Stopping API before database restore..."
          docker compose stop api

          echo "Restoring database..."

          docker compose exec -T postgres \
            psql \
            -U "\${POSTGRES_USER}" \
            -d "\${POSTGRES_DB}" \
            -v ON_ERROR_STOP=1 \
            < "\${BACKUP_FILE}"

          echo "Database restored."

          if [ -n "\${PREVIOUS_TAG}" ]; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=\${PREVIOUS_TAG}/" .env

            echo "Restoring API version: \${PREVIOUS_TAG}"

            IMAGE_TAG="\${PREVIOUS_TAG}" docker compose pull api
            docker compose up -d api
          fi

          echo "Waiting for rollback health..."

          for i in \$(seq 1 12); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "Rollback successful."

              docker compose ps
              exit 1
            fi

            echo "Rollback health check attempt \${i}/12 failed."

            if [ "\${i}" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "========================================"
          echo "CRITICAL ERROR"
          echo "Deployment failed."
          echo "Rollback also failed."
          echo "Backup: \${BACKUP_FILE}"
          echo "Previous version: \${PREVIOUS_TAG}"
          echo "========================================"

          docker compose ps
          docker logs molaryx-api --tail 100

          exit 1

          REMOTE_SCRIPT
          )

          PARAMETERS=$(jq -nc \
            --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.Status')

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Remote deployment failed."
            exit 1
          fi